<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Midnight Snack</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#070d24;height:100%;overflow:hidden;cursor:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { createState, legalPlacements, place, undo, lastPlacer, startRun, step, resetRun, hint, levelList } from './src/engine.js';
import { render, trayFor, cameraOf } from './src/render.js';
import { CONFIG } from './src/config.js';
import { unlock, sfx, eventSound, setMuted, isMuted, ambience } from './src/audio.js';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SEED = 1;
const HOUSES = levelList();
let players = CONFIG.players, playersSel = CONFIG.players, pickerSel = 1, house = 0;
let state = createState(SEED, 0, { players });
let prev = null, screen = 'title', beat = null, screenT = 0, tickAcc = 0, history = [], rewindFrom = null, snap = true;
let buttonDown = false, holdStart = 0, speed = 1, lastSnore = 0, afterPlayers = 'picker';
const fails = HOUSES.map(() => 0);
let solved = HOUSES.map(() => false);
try { const saved = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '[]'); if (Array.isArray(saved)) solved = HOUSES.map((h, i) => !!saved[i]); } catch (e) { /* storage blocked: session only */ }
const ui = { mode: 'tray', tray: 0, trayList: trayFor(state), cells: [], cellIdx: 0, sel: null, hold: 0, holdKind: '', muted: false, full: false };

function saveSolved() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(solved)); } catch (e) { /* session only */ } }
function setScreen(sc) { screen = sc; screenT = performance.now(); document.title = 'Midnight Snack (' + sc + ')'; }
function play(name) { if (sfx[name]) sfx[name](); }
function firstUnsolved() { const i = solved.indexOf(false); return i < 0 ? 0 : i; }

function startHouse(i) {
  house = i;
  state = createState(SEED, i, { players });
  prev = null; history = []; beat = null;
  ui.mode = 'tray'; ui.tray = 0; ui.trayList = trayFor(state); ui.hold = 0; ui.holdKind = '';
  snap = true; setScreen('build');
}
function toPicker() { pickerSel = 1 + firstUnsolved(); snap = true; setScreen('picker'); }

function move(d) {
  if (screen === 'players') { playersSel = ((playersSel - 1 + d + 4) % 4) + 1; play('tick'); return; }
  if (screen === 'picker') { pickerSel = (pickerSel + d + 4) % 4; play('tick'); return; }
  if (screen !== 'build') return;
  if (ui.mode === 'tray') ui.tray = (ui.tray + d + ui.trayList.length) % ui.trayList.length;
  else ui.cellIdx = (ui.cellIdx + d + ui.cells.length) % ui.cells.length;
  holdStart = 0; ui.hold = 0;
  play('tap');
}

function toggleFull() {
  try {
    if (document.fullscreenElement) { const p = document.exitFullscreen(); if (p) p.catch(() => {}); }
    else if (document.documentElement.requestFullscreen) { const p = document.documentElement.requestFullscreen(); if (p) p.catch(() => {}); }
  } catch (e) { /* not allowed here */ }
}
addEventListener('fullscreenchange', () => { ui.full = !!document.fullscreenElement; });

function press() {
  unlock();
  if (screen === 'title') { playersSel = players; afterPlayers = 'picker'; play('pop'); setScreen('players'); return; }
  if (screen === 'players') { players = playersSel; play('pop'); toPicker(); return; }
  if (screen === 'picker') {
    play('pop');
    if (pickerSel === 0) { playersSel = players; setScreen('players'); return; }
    startHouse(pickerSel - 1); return;
  }
  if (screen === 'win') { if (performance.now() - screenT > 1200) { play('pop'); toPicker(); } return; }
  if (screen !== 'build') return;
  if (ui.mode === 'cell') {
    const c = ui.cells[ui.cellIdx];
    if (c) { state = place(state, c); play('pop'); } else play('tap');
    ui.mode = 'tray';
    return;
  }
  const k = ui.trayList[ui.tray];
  if (k === 'undo') { const p = lastPlacer(state); if (p >= 0) { state = undo(state, p); play('rewind'); } return; }
  if (k === 'sound') { ui.muted = !isMuted(); setMuted(ui.muted); return; }
  if (k === 'full') { toggleFull(); return; }
  if (k === 'go' || k === 'home') { holdStart = performance.now(); ui.holdKind = k; return; }
  const cells = legalPlacements(state).filter((p) => p.type === k);
  if (!cells.length) { play('thud'); return; }
  ui.sel = k; ui.cells = [null, ...cells]; ui.mode = 'cell';
  const h = currentHint();
  const hi = h && h.type === k ? ui.cells.findIndex((c) => c && c.x === h.x && c.y === h.y) : -1;
  ui.cellIdx = 1;
  if (hi > 0 && fails[house] >= CONFIG.hintAfterFails + 1) ui.cellIdx = hi; // after a third miss the ghost starts on the hint
}

function input(name, down = true) {
  if (name === 'left' && down) move(-1);
  else if (name === 'right' && down) move(1);
  else if (name === 'button') {
    if (down && !buttonDown) { buttonDown = true; press(); }
    else if (!down) { buttonDown = false; holdStart = 0; ui.hold = 0; }
  }
}

addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); input('left'); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); input('right'); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!e.repeat) input('button', true); }
  else if (e.key === 'm' || e.key === 'M') { unlock(); ui.muted = !isMuted(); setMuted(ui.muted); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});
addEventListener('keyup', (e) => { if (e.key === 'Enter' || e.key === ' ') input('button', false); });

const pad = { a: false, l: false, r: false };
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let a = false, l = false, r = false;
  for (const p of pads) {
    if (!p) continue;
    if (p.buttons[0] && p.buttons[0].pressed) a = true;
    if ((p.buttons[14] && p.buttons[14].pressed) || p.axes[0] < -0.5) l = true;
    if ((p.buttons[15] && p.buttons[15].pressed) || p.axes[0] > 0.5) r = true;
  }
  if (l && !pad.l) input('left');
  if (r && !pad.r) input('right');
  if (a !== pad.a) input('button', a);
  pad.a = a; pad.l = l; pad.r = r;
}

function currentHint() { return screen === 'build' && fails[house] >= CONFIG.hintAfterFails ? hint(state) : null; }

function advance() {
  prev = state;
  state = step(state);
  history.push(state);
  for (const e of state.events) if (e.tick === state.tick && eventSound[e.type]) play(eventSound[e.type]);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  pollPad();
  let alpha = 1;
  if (screen === 'build') {
    if (holdStart && ui.trayList[ui.tray] === ui.holdKind) {
      ui.hold = Math.min(1, (now - holdStart) / CONFIG.holdMs);
      if (ui.hold >= 1) {
        const k = ui.holdKind; holdStart = 0; ui.hold = 0; ui.holdKind = '';
        if (k === 'go') { state = startRun(state); prev = null; history = [state]; tickAcc = 0; play('pop'); setScreen('run'); }
        else { play('rewind'); toPicker(); }
      }
    }
    if (now - lastSnore > 4500) { lastSnore = now; play('snore'); }
  } else if (screen === 'run') {
    const ms = CONFIG.tickMs / ((buttonDown ? 3 : 1) * speed);
    tickAcc += dt;
    while (tickAcc >= ms && state.phase === 'run') { tickAcc -= ms; advance(); }
    alpha = Math.min(1, tickAcc / ms);
    if (state.phase === 'done' && alpha >= 1) {
      if (state.result === 'win') { solved[house] = true; fails[house] = 0; saveSolved(); play('win'); setScreen('win'); }
      else { beat = state.result === 'woke' ? 'woke' : 'shrug'; play(beat === 'woke' ? 'gasp' : 'thud'); setScreen('beat'); }
    }
  } else if (screen === 'beat') {
    if (now - screenT > CONFIG.beatMs / speed) { rewindFrom = state; play('rewind'); setScreen('rewind'); }
  } else if (screen === 'rewind') {
    const k = Math.min(1, (now - screenT) / (CONFIG.rewindMs / speed));
    const i = Math.max(0, Math.round((history.length - 1) * (1 - k)));
    state = history[i]; prev = null;
    if (k >= 1) { state = resetRun(rewindFrom); fails[house]++; ui.mode = 'tray'; beat = null; setScreen('build'); }
  }
  ambience(true, screen === 'run' || screen === 'beat' ? 0.35 : 1);
  render(ctx, { screen, state, prev, alpha, ui, time: now, beat, w: cv.width, h: cv.height, players, playersSel, pickerSel, solved, hint: currentHint(), since: now - screenT, snap });
  snap = false;
  requestAnimationFrame(frame);
}

window.__game = {
  get screen() { return screen; },
  get state() { return state; },
  get ui() { return ui; },
  get beat() { return beat; },
  get players() { return players; },
  get playersSel() { return playersSel; },
  get pickerSel() { return pickerSel; }, // 0 = players card, 1..3 = houses
  get house() { return house; },
  get houses() { return HOUSES; },
  get solved() { return solved.slice(); },
  get fails() { return fails.slice(); },
  get hint() { return currentHint(); },
  get camera() { return cameraOf(); },
  input, // input('left'|'right'|'button', down?)
  tap(name) { input(name, true); if (name === 'button') input('button', false); },
  set speed(v) { speed = v; }, get speed() { return speed; },
};
requestAnimationFrame(frame);
</script></body></html>
